name: Build and Release Sultan Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device to build (Pixel 8 / shiba = zuma)"
        type: choice
        options:
          - zuma
          - gs201
          - zumapro
          - all
        default: zuma
      make_release:
        description: "Create a GitHub release after a successful build"
        type: boolean
        default: false

jobs:
  # Pixel 7 / 7 Pro / 7a
  build-kernel-gs201:
    if: ${{ inputs.device == 'all' || inputs.device == 'gs201' }}
    uses: ./.github/workflows/sultan.yml
    secrets: inherit
    with:
      codename: "gs201"
      android_version: "android14"
      kernel_version: "6.1"

  # Pixel 8 / 8 Pro (shiba / husky)
  build-kernel-zuma:
    if: ${{ inputs.device == 'all' || inputs.device == 'zuma' }}
    uses: ./.github/workflows/sultan.yml
    secrets: inherit
    with:
      codename: "zuma"
      android_version: "android14"
      kernel_version: "6.1"

  # Pixel 9 / 9 Pro / 9 Pro XL
  build-kernel-zumapro:
    if: ${{ inputs.device == 'all' || inputs.device == 'zumapro' }}
    uses: ./.github/workflows/sultan.yml
    secrets: inherit
    with:
      codename: "zumapro"
      android_version: "android14"
      kernel_version: "6.1"

  trigger-release:
    runs-on: ubuntu-latest
    needs:
      - build-kernel-gs201
      - build-kernel-zuma
      - build-kernel-zumapro
    if: |
      always() &&
      !cancelled() &&
      inputs.make_release &&
      (needs.build-kernel-gs201.result == 'success' || needs.build-kernel-gs201.result == 'skipped') &&
      (needs.build-kernel-zuma.result == 'success' || needs.build-kernel-zuma.result == 'skipped') &&
      (needs.build-kernel-zumapro.result == 'success' || needs.build-kernel-zumapro.result == 'skipped') &&
      (needs.build-kernel-gs201.result == 'success' || needs.build-kernel-zuma.result == 'success' || needs.build-kernel-zumapro.result == 'success')
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NAME: "Sultan 6.1.145 + KernelSU-Next & SUSFS (A16 / android14-11 ABI)"
      RELEASE_NOTES: |
        Built from Sultan `16.0.0-sultan` (Linux **6.1.145**) for Android 16 ROMs that ship the android14-11 GKI ABI (e.g. Evolution X 11.x).

        ### Variants
        * **stock**: Unmodified Sultan base.
        * **ksun-susfs**: KernelSU-Next (pershoot `dev-susfs`) + SUSFS, Mountify, BBR, and IPSet.

        ### Device mapping
        * **gs201** — Pixel 7 / 7 Pro / 7a
        * **zuma** — Pixel 8 / 8 Pro (shiba / husky)
        * **zumapro** — Pixel 9 / 9 Pro / 9 Pro XL

        **Sultan commit:** https://github.com/kerneltoast/android_kernel_google_tensynos/commit/TENSYNOS_HASH

        Module: https://github.com/sidex15/ksu_module_susfs
        Manager: https://github.com/KernelSU-Next/KernelSU-Next

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate and Create New Tag
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          LATEST_TAG=$(gh api "repos/$REPO/tags" --jq '.[0].name' 2>/dev/null || true)
          if [ -z "${LATEST_TAG:-}" ] || [ "$LATEST_TAG" = "null" ]; then
            LATEST_TAG="v2.0.0-r0"
          fi

          NEW_TAG=$(echo "$LATEST_TAG" | awk -F'-r' '{suffix=$2; if (!suffix) suffix=0; suffix++; printf "%s-r%d", $1, suffix}')
          echo "New tag: $NEW_TAG"
          echo "NEW_TAG=${NEW_TAG}" >> "$GITHUB_ENV"

          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      - name: Fetch and Inject Sultan Commits
        run: |
          set -euo pipefail
          TENSYNOS_COMMIT=$(git ls-remote https://github.com/kerneltoast/android_kernel_google_tensynos refs/heads/16.0.0-sultan | awk '{print $1}')
          UPDATED_NOTES="${RELEASE_NOTES//TENSYNOS_HASH/$TENSYNOS_COMMIT}"

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "RELEASE_NOTES<<$EOF"
            echo "$UPDATED_NOTES"
            echo "$EOF"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          gh release create "$NEW_TAG" \
            --title "$RELEASE_NAME" \
            --notes "$RELEASE_NOTES"

      - name: Upload Release Assets Dynamically
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in ./downloaded-artifacts/kernel-*/*; do
            if [ -d "$file" ]; then
              continue
            fi

            dir=$(dirname "$file")
            filename=$(basename "$file")
            name="${filename%.*}"
            ext="${filename##*.}"
            new_filepath="$dir/${name}-${NEW_TAG}.${ext}"
            mv "$file" "$new_filepath"

            echo "Uploading $new_filepath..."
            gh release upload "$NEW_TAG" "$new_filepath"
          done

      - name: Display Files Uploaded
        run: |
          echo "GitHub release created with the following files:"
          find ./downloaded-artifacts -type f -print
