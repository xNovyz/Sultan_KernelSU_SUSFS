name: Sultan
permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      codename:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["stock", "ksun-susfs"]
    steps:
      - name: Maximize Build Space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-swapfile: "true"
          remove-cached-tools: "false"
          verbose: "true"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev cpio zip unzip \
            curl git patch python3 wget

      - name: Download and extract GCC 14.2.0 toolchain
        run: |
          echo "Downloading GCC 14.2.0 cross-compiler toolchain..."
          wget -q https://www.kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz
          echo "Extracting toolchain..."
          tar -xzf x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz
          rm -f x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz
          echo "GCC 14.2.0 toolchain extracted successfully"

      - name: Set CONFIG Environment Variable
        run: |
          CONFIG="android_kernel_google_tensynos"
          echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"
          echo "CONFIG set to: $CONFIG"

      - name: Clone AnyKernel3 and Other Dependencies
        run: |
          set -euo pipefail
          echo "Cloning AnyKernel3 and other dependencies..."

          ANYKERNEL_BRANCH="sultan-${{ inputs.codename }}"
          SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
          SULTAN_BRANCH="16.0.0-sultan"

          echo "AnyKernel3 branch: $ANYKERNEL_BRANCH"
          echo "SUSFS branch: $SUSFS_BRANCH"
          echo "Sultan branch: $SULTAN_BRANCH (6.1.145 — matches EvoX android14-11 ABI)"

          git clone --depth=1 -b "$ANYKERNEL_BRANCH" https://github.com/TheWildJames/AnyKernel3.git
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git
          # Pin Sultan's current tensynos tip (Android 16 / Linux 6.1.145)
          git clone --depth=1 -b "$SULTAN_BRANCH" https://github.com/kerneltoast/android_kernel_google_tensynos.git

          git clone --depth=1 -b "$SUSFS_BRANCH" https://gitlab.com/simonpunk/susfs4ksu.git

          # Same as WildKernels GKI: cherry-pick pershoot's latest two
          # gki-android14-6.1-dev commits (no-features core + Toolkit coexistence).
          # Local pershoot/ patches were removed from kernel_patches in Sep 2026.
          cd susfs4ksu
          git fetch https://gitlab.com/pershoot/susfs4ksu.git gki-android14-6.1-dev || true
          git log ..FETCH_HEAD --oneline -n 2 | awk '{print $1}' | tac | xargs -r git cherry-pick 2>/dev/null || true
          cd ..

          echo "Sultan HEAD: $(git -C android_kernel_google_tensynos rev-parse HEAD)"
          echo "SUSFS HEAD: $(git -C susfs4ksu rev-parse HEAD)"

      - name: Add KernelSU
        if: contains(matrix.features, 'ksun')
        run: |
          set -euo pipefail
          cd "$CONFIG"
          echo "Adding KernelSU-Next (pershoot dev-susfs)..."
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs

          # Sultan builds with GCC + -Werror=designated-init. KernelSU's
          # `struct selinux_state fake_state = {0};` is a positional init and
          # fails the build (GKI uses Clang and does not hit this).
          if [ -f drivers/kernelsu/feature/selinux_hide.c ]; then
            sed -i 's/struct selinux_state fake_state = {0};/struct selinux_state fake_state = {};/' \
              drivers/kernelsu/feature/selinux_hide.c
          fi
          if [ -f drivers/kernelsu/Kbuild ] && ! grep -q 'Wno-error=designated-init' drivers/kernelsu/Kbuild; then
            echo 'ccflags-y += -Wno-error=designated-init' >> drivers/kernelsu/Kbuild
          fi

      - name: Apply SUSFS Patches
        if: contains(matrix.features, 'susfs')
        run: |
          set -euo pipefail
          cd "$CONFIG"

          echo "Applying SUSFS patches..."
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/

          # Temporarily drop Sultan's libperfmgr_redirect guard so the SUSFS
          # open.c hunks can apply, then restore it.
          perl -0pi -e 's/if \(IS_ERR\(f\) && !libperfmgr_redirect\(&f, dfd, tmp, &op, how\)\) \{/if (IS_ERR(f)) {/g' fs/open.c

          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch || true

          perl -0pi -e 's/if \(IS_ERR\(f\)\) \{/if (IS_ERR(f) && !libperfmgr_redirect(&f, dfd, tmp, &op, how)) {/g' fs/open.c

          patch -p1 < ../kernel_patches/sultan/sys.c_fix.patch

      - name: Configure KernelSU
        if: contains(matrix.features, 'ksun')
        run: |
          set -euo pipefail
          cd "$CONFIG"
          DEFCONFIG="./arch/arm64/configs/${{ inputs.codename }}_defconfig"
          echo "# KernelSU Configuration" >> "$DEFCONFIG"
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          # KernelSU links hook/*/patch_memory.o (ksu_patch_text for selinux_hide)
          # only when CONFIG_KPROBES=y. Sultan leaves it unset → link failure.
          # With CONFIG_KSU_SUSFS=y, syscall-hook objects stay excluded in Kbuild.
          echo "CONFIG_KPROBES=y" >> "$DEFCONFIG"
          if [[ "${{ matrix.features }}" == *"susfs"* ]]; then
            echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
          else
            echo "CONFIG_KSU_MANUAL_HOOKS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS=n" >> "$DEFCONFIG"
            patch -p1 < ../kernel_patches/wild/hooks/69_pure_manual_hooks_only.patch
          fi

      - name: Configure Mountify Support
        if: matrix.features == 'ksun-susfs'
        run: |
          cd "$CONFIG"
          DEFCONFIG="./arch/arm64/configs/${{ inputs.codename }}_defconfig"
          echo "# Mountify Support" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"

      - name: Configure Networking
        run: |
          cd "$CONFIG"
          DEFCONFIG="./arch/arm64/configs/${{ inputs.codename }}_defconfig"
          echo "# Networking Configuration" >> "$DEFCONFIG"
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> "$DEFCONFIG"
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> "$DEFCONFIG"
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> "$DEFCONFIG"

      - name: Add IP SET & IPv6_NAT Support
        shell: bash
        run: |
          cd "$CONFIG"
          cat >> "./arch/arm64/configs/${{ inputs.codename }}_defconfig" << 'EOF'
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          EOF

      - name: Apply TCP Congestion Control
        shell: bash
        run: |
          cd "$CONFIG"
          cat >> "./arch/arm64/configs/${{ inputs.codename }}_defconfig" << 'EOF'
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          EOF

      - name: Run sed and perl Commands
        if: matrix.features == 'ksun-susfs'
        run: |
          cd "$CONFIG"
          sed -i 's/CONFIG_LOCALVERSION="-Sultan"/CONFIG_LOCALVERSION="-Sultan-Wild"/' ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          sed -i '/echo "+"$/d' scripts/setlocalversion

      - name: Build the Kernel
        run: |
          set -euo pipefail
          cd "$CONFIG"
          export PATH="$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin:$PATH"
          CROSS="$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux-"
          CC="${CROSS}gcc"

          make CROSS_COMPILE="$CROSS" CC="$CC" -j"$(nproc)" "${{ inputs.codename }}_defconfig"
          make CROSS_COMPILE="$CROSS" CC="$CC" LOCALVERSION_AUTO=0 -j"$(nproc)"

          test -f out/arch/arm64/boot/Image.lz4

      - name: Copy Images
        run: |
          set -euo pipefail
          cd "$CONFIG"

          echo "Copying Image.lz4 and concatenating DTB files..."
          cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          cat ./out/google-devices/${{ inputs.codename }}/dts/*.dtb > ../AnyKernel3/dtb

      - name: Create ZIP Files for Different Formats
        run: |
          cd ./AnyKernel3
          ZIP_NAME="${{ inputs.codename }}-a16-${{ matrix.features }}-anykernel3.zip"
          echo "Creating zip file $ZIP_NAME..."
          zip -r "../$ZIP_NAME" ./*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.codename }}-${{ matrix.features }}
          path: |
            *.zip

      - name: Collect .rej files
        if: ${{ always() }}
        id: collect_rej
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"
          rm -rf rej
          mkdir -p rej

          found="false"
          while IFS= read -r -d '' rej_file; do
            found="true"
            original_file="${rej_file%.rej}"
            rej_rel="${rej_file#./}"
            original_rel="${original_file#./}"

            mkdir -p "rej/$(dirname "$rej_rel")"
            cp -f "$rej_file" "rej/$rej_rel"

            if [[ -f "$original_file" ]]; then
              mkdir -p "rej/$(dirname "$original_rel")"
              cp -f "$original_file" "rej/$original_rel"
            fi
          done < <(find . -type f -name '*.rej' -print0)

          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Zip collected .rej bundle
        if: ${{ always() && steps.collect_rej.outputs.found == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          zip -r "rej-${{ inputs.codename }}-${{ matrix.features }}.zip" rej

      - name: Upload .rej bundle
        if: ${{ always() && steps.collect_rej.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rej-${{ inputs.codename }}-${{ matrix.features }}
          path: |
            rej-${{ inputs.codename }}-${{ matrix.features }}.zip
